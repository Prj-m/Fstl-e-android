name: Android validation bundle

on:
  pull_request:
  workflow_dispatch:
    inputs:
      phone_apk:
        description: Build a separate debug-signed phone test APK
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-bundle-${{ github.ref }}
  # Preserve expensive dependency compilation so its completed cache can be reused.
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  occt:
    name: OCCT for ${{ matrix.abi }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    env:
      NDK_VERSION: '27.2.12479018'
      OCCT_COMMIT: a016080bf6738d6aeae020badee4e888ad1540a5 # OCCT 7.9.3
      FSTL_BUILD_JOBS: '4'
      FSTL_ANDROID_ABI: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache compiled Android OCCT
        id: occt-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/occt-install
          key: occt-${{ runner.os }}-${{ matrix.abi }}-${{ env.OCCT_COMMIT }}-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build_occt_android.sh') }}
      - name: Set up Android command-line tools
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 12266719
      - name: Install NDK and Ninja
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          sdkmanager "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Obtain the pinned OCCT source
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: |
          echo "FSTL_OCCT_SOURCE=$RUNNER_TEMP/occt-source" >> "$GITHUB_ENV"
          echo "FSTL_OCCT_ROOT=$RUNNER_TEMP/occt-install" >> "$GITHUB_ENV"
          git init "$RUNNER_TEMP/occt-source"
          git -C "$RUNNER_TEMP/occt-source" remote add origin https://github.com/Open-Cascade-SAS/OCCT.git
          git -C "$RUNNER_TEMP/occt-source" fetch --depth 1 origin "$OCCT_COMMIT"
          git -C "$RUNNER_TEMP/occt-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/occt-source" rev-parse HEAD)" = "$OCCT_COMMIT"
      - name: Build the STEP library and its dependencies
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_occt_android.sh
      - name: Save completed OCCT dependency build
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/occt-install
          key: ${{ steps.occt-cache.outputs.cache-primary-key }}
  android:
    name: Unsigned arm64/armv7/x86_64 bundle with full STEP support
    needs: occt
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QT_VERSION: '6.11.3'
      NDK_VERSION: '27.2.12479018'
      OCCT_COMMIT: a016080bf6738d6aeae020badee4e888ad1540a5 # OCCT 7.9.3
      FSTL_BUILD_JOBS: '4'
      FSTL_ANDROID_ABIS: arm64-v8a armeabi-v7a x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 12266719
      - name: Install build tools and Android SDK packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "FSTL_OCCT_ROOT=$RUNNER_TEMP/occt-install" >> "$GITHUB_ENV"
      # Secondary ABI kits first: each step overwrites QT_ROOT_DIR, which must
      # end up pointing at the primary arm64 kit. Kits install side by side.
      - name: Install Qt for Android (armv7)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.11.3'
          host: all_os
          target: android
          arch: android_armv7
          cache: true
      - name: Install Qt for Android (x86_64)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.11.3'
          host: all_os
          target: android
          arch: android_x86_64
          cache: true
      - name: Install Qt for Android (arm64) and its host tools
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.11.3'
          host: all_os
          target: android
          arch: android_arm64_v8a
          extra: --autodesktop
          cache: true
      - name: Restore OCCT (armeabi-v7a)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/occt-install
          key: occt-${{ runner.os }}-armeabi-v7a-${{ env.OCCT_COMMIT }}-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build_occt_android.sh') }}
          fail-on-cache-miss: true
      - name: Move OCCT (armeabi-v7a) to its ABI prefix
        run: mv "$FSTL_OCCT_ROOT" "$FSTL_OCCT_ROOT-armeabi-v7a"
      - name: Restore OCCT (x86_64)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/occt-install
          key: occt-${{ runner.os }}-x86_64-${{ env.OCCT_COMMIT }}-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build_occt_android.sh') }}
          fail-on-cache-miss: true
      - name: Move OCCT (x86_64) to its ABI prefix
        run: mv "$FSTL_OCCT_ROOT" "$FSTL_OCCT_ROOT-x86_64"
      - name: Restore OCCT (arm64-v8a, restored last into the default prefix)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/occt-install
          key: occt-${{ runner.os }}-arm64-v8a-${{ env.OCCT_COMMIT }}-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build_occt_android.sh') }}
          fail-on-cache-miss: true
      - name: Build, lint and verify unsigned bundle
        env:
          FSTL_SIGN_WITH_KEYSTORE: '0'
        run: |
          export QT_ANDROID_ROOT="$QT_ROOT_DIR"
          export FSTL_ANDROID_BUILD_DIR="$GITHUB_WORKSPACE/build/android-release"
          bash scripts/build_android_full_release_aab.sh
      - name: Validate the packaged release manifest
        run: bash scripts/check_android_release.sh build/android-release/artifacts/fstl-e-release.aab
      - name: Package phone test APK
        if: github.event_name == 'pull_request' || inputs.phone_apk
        run: |
          export QT_ANDROID_ROOT="$QT_ROOT_DIR"
          export FSTL_ANDROID_BUILD_DIR="$GITHUB_WORKSPACE/build/android-release"
          bash scripts/package_android_phone_apk.sh
      - name: Save phone test APK
        if: github.event_name == 'pull_request' || inputs.phone_apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fstl-e-phone-${{ github.sha }}
          path: build/android-release/phone-artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Save unsigned bundle and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fstl-e-unsigned-${{ github.sha }}
          path: build/android-release/artifacts/*
          if-no-files-found: error
          retention-days: 14
